# tobor node settings. Keys marked (operator) can only be changed by the operator, not by the agent.
# Durations: 30m, 12h, 90d.

# roots: default is this TOBOR_HOME   # (operator) directories sessions may start in
# env_file: agent.env           # relative to $TOBOR_HOME, never inside .tobor/
# listen: 127.0.0.1:7879        # (operator)
# artifacts_listen: 127.0.0.1:7880
# public_url: http://localhost:7879
# allowed_hosts: []             # (operator)
# allowed_origins: []           # (operator)
# notify:
#   ntfy: { url: https://ntfy.sh, topic: tobor-change-me }
#   on: [approval, error, settled]

defaults:
  model: anthropic/claude-opus-5-5
  thinking: high
  approval_mode: ask            # (operator) ask | auto
  max_turns: 100
  mode: director                # director | solo
  max_workers: 8
  # worker_model: anthropic/claude-sonnet-5-5   # workers whose agent file sets no model
  idle: 30m
  approval_timeout: 12h

# agents: { model_overrides: { worker: anthropic/claude-opus-5-5 } }   # beats the agent file, not a task item's model

retention: { context: 30d, documents: 90d }
# mcp: { approval: { github: { allow: [list_issues], ask: [create_issue] } } }   # (operator)
artifacts: { theme: retro-log }
# search: { provider: auto, max_results: 10 }   # auto | brave | tavily | searxng (+ url) | exa | duckduckgo | none; keys in agent.env
# fetch: { allow_private: false, max_chars: 20000, timeout_ms: 20000, remote_reader: true }
